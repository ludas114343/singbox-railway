<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge API Gateway | Telemetry Ingestion</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --success: #22c55e; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }
    .title { font-size: 1.5rem; font-weight: 700; }
    .badge { background: rgba(34, 197, 94, 0.15); color: var(--success); padding: 0.35rem 0.8rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.25rem; }
    .card-label { font-size: 0.875rem; color: var(--muted); margin-bottom: 0.5rem; }
    .card-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .status-section { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.5rem; }
    .status-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; }
    .row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .row:last-child { border-bottom: none; }
    .row-label { color: var(--muted); }
    .row-val { font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Edge Ingress Pipeline</div>
      <div class="badge"><span class="badge-dot"></span> Operational</div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="card-label">Cluster Status</div>
        <div class="card-value" style="color: var(--success)">Healthy</div>
      </div>
      <div class="card">
        <div class="card-label">P99 Ingress Latency</div>
        <div class="card-value">1.1 ms</div>
      </div>
      <div class="card">
        <div class="card-label">Transport Engine</div>
        <div class="card-value">Wire-Speed Native</div>
      </div>
    </div>
    <div class="status-section">
      <div class="status-title">Cluster Telemetry</div>
      <div class="row"><span class="row-label">Region</span><span class="row-val">North America (US East)</span></div>
      <div class="row"><span class="row-label">Ingress Protocol</span><span class="row-val">RFC 6455 Fast WebSocket</span></div>
      <div class="row"><span class="row-label">Service Health</span><span class="row-val">100.0% Uptime (Last 30 Days)</span></div>
    </div>
  </div>
</body>
</html>
